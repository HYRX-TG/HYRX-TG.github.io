# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 河岳日星的博客
subtitle: '运维工程师 | AI 算法学习者'
description: '专注运维、AI算法'
keywords: [Python, 运维, AI算法, 数据分析, Hexo]
author: HYRX-TG
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://hyrx-tg.github.io
root: /
permalink: :year/:month/:day/:abbrlink/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory 目录配置
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 40
pagination_dir: page

include:
exclude:
ignore:

# Extensions
theme: butterfly

# live2d 看板娘全局关闭（插件读取站点配置，主题配置里的设置传不进来）
live2d:
  enable: false

# Deployment 🔥 已换成你的 GitHub 地址
# 注意：GitHub Pages 实际是从 gh-pages 分支提供服务的（不是 main），
# 所以 deploy 目标分支设为 gh-pages，否则推到 main 线上站不会更新。
deploy:
  type: git
  repo: git@github.com:HYRX-TG/HYRX-TG.github.io.git
  branch: gh-pages
  force: true

# 压缩配置 hexo-neat
neat_enable: true
neat_html:
  enable: true
  exclude:
neat_css:
  enable: true
  exclude:
    - '**/*.min.css'
neat_js:
  enable: true
  mangle: true
  output:
  compress:
  exclude:
    - '**/*.min.js'
    - '**/jquery.fancybox.pack.js'
    - '**/index.js'