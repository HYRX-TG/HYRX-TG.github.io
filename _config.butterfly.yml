    # 👇 这里只保留这一段，把其他乱七八糟的先注释掉或删掉
    - '<style type="text/css">
        /* 音乐播放器样式保留 */
        .aplayer.aplayer-fixed.aplayer-narrow .aplayer-body {left: -66px !important;}
        .aplayer.aplayer-fixed.aplayer-narrow .aplayer-body:hover {left: 0 !important;}

        /* ===================================== */
        /*  核心修复：锁定落日余晖背景  */
        /* ===================================== */
        body {
          background: url(/img/山水余晖.png) !important;          
          background-size: cover !important;
          background-position: center !important;
          background-attachment: fixed !important;
          background-repeat: no-repeat !important;
        }
        /* 强制让页面容器透明，露出背景 */
        #layout, #body_bg, #web_bg {
          background: transparent !important;
        }
      </style>'

    # 下面这些样式表先暂时注释掉（或者保留，不影响，主要是避免冲突）
